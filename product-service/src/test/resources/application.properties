# Test configuration. This file sits on the test classpath BEFORE the main
# application.properties, so tests always run against a throw-away in-memory
# H2 database and never touch the demo data files.
spring.application.name=product-service
spring.datasource.url=jdbc:h2:mem:product-test-db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
# Auth: low BCrypt cost keeps tests fast; seeding is off so tests start from an empty DB.
reloop.security.bcrypt-strength=4
reloop.seed.enabled=false
reloop.jwt.secret=test-only-jwt-secret-0123456789-abcdefghijklmnop
