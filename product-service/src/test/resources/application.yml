# Test configuration. Because this file sits on the test classpath BEFORE the
# main application.yml, it fully replaces it during tests: tests always run
# against a throw-away in-memory H2 database, never the demo data files.
spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:mem:product-test-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
