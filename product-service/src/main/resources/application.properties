# ── Product & Account Service (PC1) ────────────────────────────────
spring.application.name=product-service

# H2 database (file-based so demo data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/reloop_product;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HTTP port
server.port=8081

# Actuator health-check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Authentication (Phase 3) ───────────────────────────────────────
# JWT signing secret (HS256, >= 32 bytes). The value below is for LOCAL DEVELOPMENT ONLY.
# Override with the environment variable RELOOP_JWT_SECRET anywhere else.
reloop.jwt.secret=${RELOOP_JWT_SECRET:reloop-local-dev-only-jwt-secret-change-me-0123456789}
reloop.jwt.ttl-seconds=3600
reloop.jwt.issuer=reloop-product-service
# BCrypt work factor (2^12 rounds)
reloop.security.bcrypt-strength=12

# repair-service (owns repairer workshop profiles) + shared service-to-service key
reloop.services.repair.base-url=http://localhost:8083
reloop.internal.api-key=${RELOOP_INTERNAL_API_KEY:reloop-local-dev-internal-key-change-me}

# Demo accounts with TEMPORARY credentials (see docs/AUTH.md). Local development only.
reloop.seed.enabled=true

# Batch-load lazy collections (product images) for browse pages instead of one query per product
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── Marketplace purchases ──────────────────────────────────────────
# Purchases go through order-service (POST /api/orders + POST /api/payments/simulate), which reserves, sells and
# releases listings via /api/internal/products/** and records fees, commission and payouts.
# The legacy one-step POST /api/products/{id}/purchase (no order, no fees) answers 410 unless enabled here.
reloop.marketplace.direct-purchase-enabled=${RELOOP_DIRECT_PURCHASE_ENABLED:false}
