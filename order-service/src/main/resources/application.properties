# ── Order & Payment Service (PC2) ──────────────────────────────────
spring.application.name=order-service

# H2 database (file-based so demo data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/reloop_order;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HTTP port
server.port=8082

# Actuator health-check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Security ────────────────────────────────────────────────────────
# Verifies JWTs issued by product-service (same secret + issuer as product-service/repair-service)
reloop.jwt.secret=${RELOOP_JWT_SECRET:reloop-local-dev-only-jwt-secret-change-me-0123456789}
reloop.jwt.issuer=reloop-product-service
# Shared service-to-service key (header X-Internal-Api-Key), same value in all services
reloop.internal.api-key=${RELOOP_INTERNAL_API_KEY:reloop-local-dev-internal-key-change-me}

# ── Fees (configurable, frozen onto each order/quote/payment when created) ─
# Defaults for every transaction type (MARKETPLACE_PURCHASE, REPAIR_BOOKING). A row in fee_rate_configs
# (PUT /api/internal/fee-rates/{type}) overrides them per type at run time.
# customer fee: added on top of the price, paid by the customer
reloop.fees.customer-fee-rate=${RELOOP_CUSTOMER_FEE_RATE:0.0200}
# provider commission: deducted from the seller's / repairer's gross amount
# (the older key reloop.fees.repairer-commission-rate is still accepted)
reloop.fees.provider-commission-rate=${RELOOP_PROVIDER_COMMISSION_RATE:${reloop.fees.repairer-commission-rate:0.0200}}
# Quotes stay valid this many days after being sent
reloop.quotes.valid-days=7

# repair-service (owns repair requests); notified after a successful repair payment
reloop.services.repair.base-url=${RELOOP_REPAIR_SERVICE_URL:http://localhost:8083}

# product-service (owns listings); reserves / sells / releases products for marketplace orders
reloop.services.product.base-url=${RELOOP_PRODUCT_SERVICE_URL:http://localhost:8081}

# ── Marketplace orders ─────────────────────────────────────────────
# Unpaid orders are cancelled and the product released after this many minutes
reloop.orders.payment-window-minutes=30
reloop.orders.expiry-sweep.enabled=true
reloop.orders.expiry-sweep.interval-ms=60000
