# Test configuration. This file sits on the test classpath BEFORE the main
# application.properties, so tests always run against a throw-away in-memory
# H2 database and never touch the demo data files.
spring.application.name=order-service
spring.datasource.url=jdbc:h2:mem:order-test-db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
reloop.jwt.secret=test-only-jwt-secret-0123456789-abcdefghijklmnop
reloop.jwt.issuer=reloop-product-service
reloop.internal.api-key=test-internal-key
reloop.fees.customer-fee-rate=0.0200
reloop.fees.provider-commission-rate=0.0200
reloop.quotes.valid-days=7
# nothing listens here: tests replace RepairServiceClient with a mock or a MockRestServiceServer
reloop.services.repair.base-url=http://localhost:1
reloop.services.product.base-url=http://localhost:1
reloop.orders.payment-window-minutes=30
# tests call OrderService.expireDueOrders() directly
reloop.orders.expiry-sweep.enabled=false
