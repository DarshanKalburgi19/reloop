# ── Repair & Tracking Service (PC3) ────────────────────────────────
spring.application.name=repair-service

# H2 database (file-based so demo data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/reloop_repair;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HTTP port
server.port=8083

# Actuator health-check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Shared service-to-service key: product-service sends it as X-Internal-Api-Key when it creates
# a repairer profile during registration. LOCAL DEVELOPMENT default; override via env var.
reloop.internal.api-key=${RELOOP_INTERNAL_API_KEY:reloop-local-dev-internal-key-change-me}

# Batch-load lazy collections (categories, working hours, services) for search result pages
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT verification. repair-service does not issue tokens: it verifies the access tokens issued by
# product-service (POST /api/auth/login), so the secret and issuer MUST match product-service.
# LOCAL DEVELOPMENT default (same as product-service); set RELOOP_JWT_SECRET everywhere else.
reloop.jwt.secret=${RELOOP_JWT_SECRET:reloop-local-dev-only-jwt-secret-change-me-0123456789}
reloop.jwt.issuer=reloop-product-service

# Demo repairer workshops (all labelled demo=true). Disable with RELOOP_SEED_ENABLED=false.
reloop.seed.enabled=${RELOOP_SEED_ENABLED:true}
