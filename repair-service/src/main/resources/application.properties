# ── Repair & Tracking Service (PC3) ────────────────────────────────
spring.application.name=repair-service

# H2 database (file-based so demo data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/reloop_repair;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HTTP port
server.port=8083

# Actuator health-check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
