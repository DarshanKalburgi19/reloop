# Test configuration. This file sits on the test classpath BEFORE the main
# application.properties, so tests always run against a throw-away in-memory
# H2 database and never touch the demo data files.
spring.application.name=repair-service
spring.datasource.url=jdbc:h2:mem:repair-test-db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_batch_fetch_size=50
reloop.jwt.secret=test-only-jwt-secret-0123456789-abcdefghijklmnop
reloop.jwt.issuer=reloop-product-service
reloop.internal.api-key=test-internal-key
reloop.seed.enabled=false
