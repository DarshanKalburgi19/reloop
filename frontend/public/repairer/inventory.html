<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory — ReLoop repairer dashboard</title>
  <meta name="description" content="Track spare parts stock for your workshop.">
  <meta name="theme-color" content="#1f5c45">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/css/reloop.css">
</head>
<body data-layout="dashboard" data-role="REPAIRER" data-nav="repairer-inventory">
<a class="skip-link" href="#main">Skip to content</a>
<div id="rl-navbar"></div>
<div class="rl-shell">
  <nav id="rl-sidebar" class="rl-sidebar"></nav>
  <main id="main" class="rl-content" tabindex="-1">
    <div class="rl-page-header">
      <div><h1>Inventory</h1><p>Spare parts stock, value and movements. Parts used in repairs are recorded against the job.</p></div>
      <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" type="button" id="add-part"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add part</button></div>
    </div>
    <div class="row g-3 mb-3" id="inv-stats"></div>
    <div id="low-stock" class="mb-3"></div>
    <ul class="nav nav-pills-soft mb-3" role="tablist">
      <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-parts" type="button" role="tab" aria-controls="tab-parts" aria-selected="true">Parts</button></li>
      <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-moves" type="button" role="tab" aria-controls="tab-moves" aria-selected="false" id="moves-tab">Stock movements</button></li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-parts" role="tabpanel">
        <form class="row g-2 mb-3" id="part-filters" role="search" aria-label="Filter parts">
          <div class="col-md-4"><label class="visually-hidden" for="pf-q">Search parts</label><input class="form-control" id="pf-q" name="q" placeholder="Search name or SKU"></div>
          <div class="col-md-3"><label class="visually-hidden" for="pf-category">Category</label><select class="form-select" id="pf-category" name="category"></select></div>
          <div class="col-md-3 d-flex align-items-center gap-3">
            <div class="form-check m-0"><input class="form-check-input" type="checkbox" id="pf-low" name="lowStockOnly" value="true"><label class="form-check-label small" for="pf-low">Low stock only</label></div>
            <div class="form-check m-0"><input class="form-check-input" type="checkbox" id="pf-disc" name="includeDiscontinued" value="true"><label class="form-check-label small" for="pf-disc">Show discontinued</label></div>
          </div>
          <div class="col-md-2"><button class="btn btn-light border w-100" type="submit">Filter</button></div>
        </form>
        <div id="parts"></div>
        <div id="parts-pager"></div>
      </div>
      <div class="tab-pane fade" id="tab-moves" role="tabpanel">
        <div id="moves"></div>
        <div id="moves-pager"></div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="/assets/js/core/api.js"></script>
<script src="/assets/js/core/ui.js"></script>
<script src="/assets/js/core/layout.js"></script>
<script src="/assets/js/components/cards.js"></script>
<script src="/assets/js/pages/inventory.js"></script>
</body>
</html>
